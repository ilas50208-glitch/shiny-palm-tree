<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Стрелялка</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; cursor: crosshair; }
        #score { position: absolute; top: 20px; left: 20px; color: white; font-family: Arial, sans-serif; font-size: 24px; z-index: 10; }
        #gameover { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-family: Arial, sans-serif; font-size: 48px; display: none; z-index: 10; text-align: center; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; }
        #restartBtn { display: none; margin-top: 20px; padding: 10px 20px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="score">Счет: 0</div>
    <div id="gameover">ИГРА ОКОНЧЕНА<br><button id="restartBtn">Играть заново</button></div>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Настройки игры ---
        let score = 0;
        let gameOver = false;
        const enemies = [];
        const spawnRate = 30; // Как часто появляются враги
        let frameCount = 0;

        // --- Сцена, Камера, Рендер ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // --- Пол (земля) ---
        const groundGeometry = new THREE.PlaneGeometry(30, 20);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -5;
        scene.add(ground);

        // --- Создание врага ---
        function createEnemy() {
            const geometry = new THREE.SphereGeometry(0.5, 16, 16);
            const material = new THREE.MeshLambertMaterial({ color: 0xff3333 });
            const enemy = new THREE.Mesh(geometry, material);
            enemy.position.x = (Math.random() - 0.5) * 20;
            enemy.position.y = 10;
            enemy.position.z = (Math.random() - 0.5) * 10;
            scene.add(enemy);
            enemies.push(enemy);
        }

        // --- Стрельба (Клик мыши) ---
        window.addEventListener('click', (event) => {
            if (gameOver) return;
            
            // Получаем координаты клика в 3D пространстве
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            // Проверяем попадание во врагов
            for (let i = enemies.length - 1; i >= 0; i--) {
                const intersects = raycaster.intersectObject(enemies[i]);
                if (intersects.length > 0) {
                    scene.remove(enemies[i]);
                    enemies.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = `Счет: ${score}`;
                    break; // Убиваем только одного врага за выстрел
                }
            }
        });

        // --- Игровой цикл ---
        function animate() {
            requestAnimationFrame(animate);

            if (!gameOver) {
                // Спавн врагов
                frameCount++;
                if (frameCount % spawnRate === 0 && enemies.length < 30) {
                    createEnemy();
                }

                // Движение врагов вниз и проверка на поражение
                for (let i = 0; i < enemies.length; i++) {
                    const enemy = enemies[i];
                    enemy.position.y -= 0.05;

                    // Если враг упал на землю
                    if (enemy.position.y < -4.5) {
                        gameOver = true;
                        document.getElementById('gameover').style.display = 'block';
                        document.getElementById('restartBtn').style.display = 'inline-block';
                        break;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // --- Перезапуск игры ---
        document.getElementById('restartBtn').addEventListener('click', () => {
            // Удаляем всех врагов
            for (let i = 0; i < enemies.length; i++) {
                scene.remove(enemies[i]);
            }
            enemies.length = 0;
            score = 0;
            gameOver = false;
            document.getElementById('score').innerText = 'Счет: 0';
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
        });

        // --- Адаптация размера экрана ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
