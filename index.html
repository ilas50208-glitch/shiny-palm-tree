<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Камень-ножницы-бумага</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#0b1120,#1a2639);padding:20px}.game-container{background:rgba(255,255,255,0.05);backdrop-filter:blur(12px);border-radius:40px;padding:40px 30px;max-width:700px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.08);text-align:center}h1{color:#fff;font-weight:600;font-size:2rem;margin-bottom:25px;text-shadow:0 0 20px rgba(100,200,255,0.2)}.score{display:flex;justify-content:space-around;color:#b0c4de;font-size:1.2rem;margin-bottom:30px;background:rgba(0,0,0,0.3);padding:15px;border-radius:60px;border:1px solid rgba(255,255,255,0.05)}.score span{font-weight:700;color:#fff;font-size:1.6rem}.vs-area{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:20px 0 30px}.choice-box{background:rgba(0,0,0,0.4);border-radius:30px;padding:20px 10px;flex:1;border:2px solid rgba(255,255,255,0.05);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center}.choice-box .emoji{font-size:4.5rem}.choice-box .label{color:#8899bb;font-size:.85rem;margin-top:10px;text-transform:uppercase}.vs-text{color:#ffd700;font-weight:800;font-size:1.8rem;text-shadow:0 0 30px rgba(255,215,0,0.4)}.buttons{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:20px 0 25px}.btn{background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.08);border-radius:60px;padding:14px 28px;font-size:1.8rem;cursor:pointer;transition:.2s;color:#fff;min-width:90px;box-shadow:0 6px 0 rgba(0,0,0,0.3)}.btn:hover{transform:translateY(-4px) scale(1.04);background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3)}.btn:active{transform:translateY(4px) scale(.96)}.result{font-size:1.4rem;font-weight:600;padding:16px;border-radius:60px;background:rgba(0,0,0,0.3);color:#e0e8f0;min-height:70px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.04);margin-top:5px}.result.win{color:#7bed9f;border-color:#7bed9f40}.result.lose{color:#ff6b81;border-color:#ff6b8140}.result.draw{color:#ffd93d;border-color:#ffd93d40}.reset-btn{margin-top:20px;background:0 0;border:1px solid rgba(255,255,255,0.15);color:#8899bb;padding:10px 26px;border-radius:40px;font-size:.9rem;cursor:pointer}.reset-btn:hover{background:rgba(255,255,255,0.05);color:#fff;border-color:rgba(255,255,255,0.3)}@media(max-width:500px){.choice-box .emoji{font-size:3rem}.btn{font-size:1.4rem;padding:10px 18px;min-width:70px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="game-container">
<h1>✊ Камень · Ножницы · Бумага</h1>
<div class="score"><div>🧑 Ты: <span id="playerScore">0</span></div><div>🤖 Комп: <span id="compScore">0</span></div></div>
<div class="vs-area"><div class="choice-box" id="playerChoice"><div class="emoji">🤔</div><div class="label">Ты</div></div><div class="vs-text">⚡</div><div class="choice-box" id="compChoice"><div class="emoji">💻</div><div class="label">Комп</div></div></div>
<div class="buttons"><button class="btn" data-move="rock">🪨</button><button class="btn" data-move="paper">📄</button><button class="btn" data-move="scissors">✂️</button></div>
<div class="result" id="resultMessage">Нажми кнопку</div>
<button class="reset-btn" id="resetBtn">🔄 Сбросить</button>
</div>
<script>const moves={rock:{emoji:"🪨",beats:"scissors"},paper:{emoji:"📄",beats:"rock"},scissors:{emoji:"✂️",beats:"paper"}},moveNames=["rock","paper","scissors"];let playerScore=0,compScore=0;const playerChoiceEl=document.getElementById("playerChoice"),compChoiceEl=document.getElementById("compChoice"),resultMsg=document.getElementById("resultMessage"),playerScoreSpan=document.getElementById("playerScore"),compScoreSpan=document.getElementById("compScore");function updateScore(){playerScoreSpan.textContent=playerScore,compScoreSpan.textContent=compScore}function getCompMove(){return moveNames[Math.floor(Math.random()*moveNames.length)]}function getWinner(e,t){return e===t?"draw":moves[e].beats===t?"win":"lose"}function playRound(e){const t=getCompMove();playerChoiceEl.querySelector(".emoji").textContent=moves[e].emoji,compChoiceEl.querySelector(".emoji").textContent=moves[t].emoji;const n=getWinner(e,t);let o="",c="";"win"===n?(playerScore++,o=`🎉 Ты выиграл! ${moves[e].emoji} побеждает ${moves[t].emoji}`,c="win"):"lose"===n?(compScore++,o=`😵 Компьютер выиграл! ${moves[t].emoji} побеждает ${moves[e].emoji}`,c="lose"):(o=`🤝 Ничья! Оба выбрали ${moves[e].emoji}`,c="draw"),resultMsg.textContent=o,resultMsg.className="result "+c,updateScore()}document.querySelectorAll(".btn[data-move]").forEach(e=>e.addEventListener("click",t=>{playRound(t.currentTarget.dataset.move)})),document.getElementById("resetBtn").addEventListener("click",()=>{playerScore=0,compScore=0,updateScore(),resultMsg.textContent="Счёт сброшен. Играй!",resultMsg.className="result",playerChoiceEl.querySelector(".emoji").textContent="🤔",compChoiceEl.querySelector(".emoji").textContent="💻"}),updateScore();
</script>
</body>
</html>
